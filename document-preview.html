<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Document Preview</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0b0b0b;
      color: #f5f5f5;
    }
    .topbar {
      padding: 10px 14px;
      border-bottom: 1px solid #333;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      background: #111;
    }
    .topbar a {
      color: #7cc7ff;
      text-decoration: none;
      font-weight: 600;
    }
    .topbar a:hover { text-decoration: underline; }
    #status {
      font-size: 0.92rem;
      opacity: 0.9;
    }
    #viewer {
      width: 100%;
      height: calc(100vh - 52px);
      border: 0;
      background: #fff;
    }
    .center {
      height: calc(100vh - 52px);
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 760px;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 18px;
      background: #141414;
    }
    code {
      background: #1f1f1f;
      padding: 2px 6px;
      border-radius: 6px;
      word-break: break-word;
    }
    .muted { opacity: 0.85; }
    .legal {
      font-size: 12px;
      color: #9a9a9a;
      opacity: 0.85;
      margin-left: auto;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a id="openRaw" href="#" target="_blank" rel="noopener">Open file directly</a>
    <span id="status">Loading…</span>
    <span class="legal">© 2026 Chip Welsh • Continuous Jubilee Calendar™ / CJC™</span>
  </div>

  <iframe id="viewer" title="Document preview" referrerpolicy="no-referrer"></iframe>

  <script>
    (function () {
      const statusEl = document.getElementById("status");
      const openRawEl = document.getElementById("openRaw");
      const viewerEl = document.getElementById("viewer");

      const params = new URLSearchParams(window.location.search);
      const file = (params.get("file") || "").trim();
      const repo = (params.get("repo") || "Continuous-Jubilee-Calendar").trim();
      const explicitUrl = (params.get("url") || "").trim();

      const user = "greysmokez";

      function showMessage(title, detailsHtml) {
        viewerEl.style.display = "none";
        const wrap = document.createElement("div");
        wrap.className = "center";
        wrap.innerHTML = `
          <div class="card">
            <h2 style="margin-top:0">${title}</h2>
            <div class="muted">${detailsHtml}</div>
          </div>
        `;
        document.body.appendChild(wrap);
      }

      function extOf(path) {
        const clean = path.split("#")[0].split("?")[0];
        const i = clean.lastIndexOf(".");
        return i >= 0 ? clean.slice(i + 1).toLowerCase() : "";
      }

      function joinUrl(base, path) {
        const safePath = path.replace(/^\/+/, "");
        return new URL(safePath, base).toString();
      }

      if (!file && !explicitUrl) {
        statusEl.textContent = "Missing ?file= or ?url= parameter";
        showMessage(
          "No file specified",
          `Use a URL like <code>document-preview.html?file=Isaiah61CJCMath.docx</code> or <code>?repo=Continuous-Jubilee-Calendar&file=Isaiah61CJCMath.docx</code>`
        );
        return;
      }

      let rawUrl = "";
      if (explicitUrl) {
        rawUrl = explicitUrl;
      } else {
        const baseUrl = `https://${user}.github.io/${repo}/`;
        rawUrl = joinUrl(baseUrl, file);
      }

      openRawEl.href = rawUrl;

      const ext = extOf(file || rawUrl);
      const officeExts = new Set([
        "doc", "docx", "ppt", "pptx", "xls", "xlsx", "odt", "ods", "odp"
      ]);

      let viewUrl = rawUrl;
      let mode = "direct";

      if (officeExts.has(ext)) {
        viewUrl = "https://view.officeapps.live.com/op/embed.aspx?src=" + encodeURIComponent(rawUrl);
        mode = "office";
      } else if (ext === "pdf") {
        viewUrl = rawUrl;
        mode = "pdf";
      } else if (["png","jpg","jpeg","gif","webp","svg","txt","md","html"].includes(ext)) {
        viewUrl = rawUrl;
        mode = "direct";
      } else {
        statusEl.textContent = "Unknown file type";
        showMessage(
          "Preview may not be supported",
          `Trying direct open for <code>${file || rawUrl}</code>. If it doesn't render, use the \"Open file directly\" link.`
        );
      }

      statusEl.textContent = `Preview mode: ${mode.toUpperCase()} • ${file || rawUrl}`;
      viewerEl.src = viewUrl;

      let loaded = false;
      viewerEl.addEventListener("load", () => { loaded = true; });

      setTimeout(() => {
        if (!loaded) {
          statusEl.textContent = "Preview timeout";
          showMessage(
            "Couldn’t load preview",
            `
              The viewer timed out. Try:
              <ol style="text-align:left;display:inline-block">
                <li>Open directly: <a href="${rawUrl}" target="_blank" rel="noopener">${rawUrl}</a></li>
                <li>Confirm file exists and exact casing matches.</li>
                <li>If it's a Word file, export to PDF for most reliable preview.</li>
              </ol>
            `
          );
        }
      }, 9000);
    })();
  </script>
</body>
</html>
